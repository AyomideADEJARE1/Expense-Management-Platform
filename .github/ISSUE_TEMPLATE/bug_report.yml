name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [frontend, backend, database, docker, nginx, ci-cd, azure, security, other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any passwords, tokens or other secrets before pasting.
      render: shell
