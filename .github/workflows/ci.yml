# Continuous Integration
#
# Runs on every pull request into main and every push to main.
# Jobs for the backend, frontend and Docker images activate automatically
# once those parts of the project exist in the repository, so this file
# does not need to be edited as the project grows.
#
# Branch protection should require only the `ci-success` check.

name: CI

on:
  pull_request:
    branches: [main, nginx, integration/deployable-main]
  push:
    branches: [main, nginx]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  detect:
    name: Detect project components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      docker: ${{ steps.check.outputs.docker }}
    steps:
      - uses: actions/checkout@v7

      - name: Check which components exist
        id: check
        run: |
          has() { [ -f "$1" ] && echo true || echo false; }
          backend=$(has backend/requirements.txt)
          frontend=$(has frontend/package.json)
          if [ -f backend/Dockerfile ] || [ -f frontend/Dockerfile ]; then docker=true; else docker=false; fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "docker=$docker"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Detected components"
            echo "| Component | Present |"
            echo "|---|---|"
            echo "| backend (backend/requirements.txt) | $backend |"
            echo "| frontend (frontend/package.json) | $frontend |"
            echo "| Dockerfiles | $docker |"
          } >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block committed .env files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files must not be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "No .env files are tracked."

      - name: Scan for secrets with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1

  database:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: expense_management_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d expense_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ci_user
      PGPASSWORD: ci_password
      PGDATABASE: expense_management_test
      POSTGRES_DB: expense_management_test
      POSTGRES_BOOTSTRAP_USER: ci_user
      POSTGRES_APP_USER: ci_app_user
      POSTGRES_APP_PASSWORD: ci-app-password-long-enough-for-ci-123456789
    steps:
      - uses: actions/checkout@v7

      - name: Apply migrations in order
        run: |
          shopt -s nullglob
          files=(database/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migrations found."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Verify expected tables exist
        run: |
          expected="budgets expense_categories expenses monthly_expense_summary users"
          actual=$(psql -tA -c "SELECT string_agg(table_name, ' ' ORDER BY table_name) FROM information_schema.tables WHERE table_schema = 'public';")
          echo "Tables found: $actual"
          for t in $expected; do
            echo " $actual " | grep -q " $t " || { echo "::error::Missing table: $t"; exit 1; }
          done
          delete_rule=$(psql -tA -c "SELECT rc.delete_rule FROM information_schema.referential_constraints AS rc JOIN information_schema.table_constraints AS tc ON tc.constraint_catalog = rc.constraint_catalog AND tc.constraint_schema = rc.constraint_schema AND tc.constraint_name = rc.constraint_name WHERE tc.table_schema = 'public' AND tc.table_name = 'budgets' AND tc.constraint_name = 'fk_budgets_category';")
          test "$delete_rule" = "RESTRICT" || { echo "::error::Budget category foreign key must use ON DELETE RESTRICT; got '$delete_rule'."; exit 1; }
          phone_column=$(psql -tA -c "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'users' AND column_name = 'phone';")
          test "$phone_column" = "1" || { echo "::error::User phone column was not created by migrations."; exit 1; }
          echo "Category deletion is restricted while budget references exist; users.phone exists."

      - name: Verify the application database role is least-privileged
        run: |
          role_flags=$(psql -tA -c "SELECT rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls FROM pg_roles WHERE rolname = '$POSTGRES_APP_USER';")
          test "$role_flags" = "f" || { echo "::error::Runtime role has administrative privileges: $role_flags"; exit 1; }
          table_access=$(psql -tA -c "SELECT has_table_privilege('$POSTGRES_APP_USER', 'public.expenses', 'SELECT') AND has_table_privilege('$POSTGRES_APP_USER', 'public.expenses', 'INSERT') AND has_table_privilege('$POSTGRES_APP_USER', 'public.expenses', 'UPDATE') AND has_table_privilege('$POSTGRES_APP_USER', 'public.expenses', 'DELETE');")
          test "$table_access" = "t" || { echo "::error::Runtime role lacks required expense-table CRUD privileges."; exit 1; }
          sequence_access=$(psql -tA -c "SELECT has_sequence_privilege('$POSTGRES_APP_USER', 'public.expenses_id_seq', 'USAGE');")
          test "$sequence_access" = "t" || { echo "::error::Runtime role lacks required sequence privileges."; exit 1; }
          if PGPASSWORD="$POSTGRES_APP_PASSWORD" psql -h "$PGHOST" -U "$POSTGRES_APP_USER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -c "CREATE ROLE qa_forbidden_role" >/dev/null 2>&1; then
            echo "::error::Runtime role unexpectedly created a database role."
            exit 1
          fi
          if PGPASSWORD="$POSTGRES_APP_PASSWORD" psql -h "$PGHOST" -U "$POSTGRES_APP_USER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -c "CREATE DATABASE qa_forbidden_db" >/dev/null 2>&1; then
            echo "::error::Runtime role unexpectedly created a database."
            exit 1
          fi
          if PGPASSWORD="$POSTGRES_APP_PASSWORD" psql -h "$PGHOST" -U "$POSTGRES_APP_USER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -c "CREATE TABLE public.qa_forbidden_table (id integer)" >/dev/null 2>&1; then
            echo "::error::Runtime role unexpectedly created a table."
            exit 1
          fi
          echo "Runtime role has required CRUD privileges and cannot create roles, databases, or schema objects."

      - name: Verify duplicate legacy budgets block the uniqueness migration
        run: |
          createdb budget_duplicate_test
          for f in database/migrations/001_initial_schema.sql database/migrations/002_user_settings.sql; do
            psql -d budget_duplicate_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -d budget_duplicate_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (full_name, email, password_hash)
          VALUES ('Migration QA', 'migration-qa@example.test', 'not-a-real-hash');
          INSERT INTO budgets (user_id, category_id, amount, month)
          VALUES
            (1, NULL, 100.00, DATE '2026-10-01'),
            (1, NULL, 200.00, DATE '2026-10-01');
          SQL
          if psql -d budget_duplicate_test -v ON_ERROR_STOP=1 -q -f database/migrations/003_budget_uniqueness.sql >migration-duplicate.log 2>&1; then
            echo "::error::Uniqueness migration unexpectedly accepted duplicate general budgets."
            exit 1
          fi
          if ! grep -q "duplicate user/month budgets with NULL category exist" migration-duplicate.log; then
            cat migration-duplicate.log
            echo "::error::Migration failed, but not with the expected duplicate-data diagnostic."
            exit 1
          fi
          echo "Duplicate legacy budgets are rejected with an actionable diagnostic."

      - name: Validate Docker Compose environment configuration
        run: |
          cp backend/.env.example backend/.env
          printf '%s\n' \
            'POSTGRES_USER=ci_user' \
            'POSTGRES_PASSWORD=ci-bootstrap-password-for-compose-test' \
            'POSTGRES_DB=expense_management_test' \
            'POSTGRES_APP_USER=ci_app_user' \
            'POSTGRES_APP_PASSWORD=ci-compose-app-password-strong-123456789' > .env
          env -u POSTGRES_APP_PASSWORD docker compose config --format json > /tmp/compose-resolved.json
          python - <<'PY'
          import json
          with open('/tmp/compose-resolved.json', encoding='utf-8') as handle:
              config = json.load(handle)
          backend = config['services']['backend']['environment']
          postgres = config['services']['postgres']['environment']
          print('Resolved credential wiring:', {
              'backend_user': backend.get('POSTGRES_USER'),
              'backend_password_matches_app': backend.get('POSTGRES_PASSWORD') == 'ci-compose-app-password-strong-123456789',
              'postgres_user': postgres.get('POSTGRES_USER'),
              'bootstrap_password_matches': postgres.get('POSTGRES_PASSWORD') == 'ci-bootstrap-password-for-compose-test',
          })
          assert backend['POSTGRES_USER'] == 'ci_app_user'
          assert backend['POSTGRES_PASSWORD'] == 'ci-compose-app-password-strong-123456789'
          assert postgres['POSTGRES_USER'] == 'ci_user'
          assert postgres['POSTGRES_PASSWORD'] == 'ci-bootstrap-password-for-compose-test'
          assert backend['POSTGRES_PASSWORD'] != postgres['POSTGRES_PASSWORD']
          assert postgres['POSTGRES_APP_USER'] == 'ci_app_user'
          assert all(service.get('restart') == 'unless-stopped' for service in config['services'].values())
          print('Compose separates bootstrap credentials from backend runtime credentials.')
          print('All four services have restart: unless-stopped.')
          PY
          if grep -q 'expense_password' /tmp/compose-resolved.json; then
            echo "::error::Resolved Compose configuration still contains the old fixed password."
            exit 1
          fi
          echo "Compose has separate database roles, no fixed legacy password, and restart policies for all four services."

      - name: Verify public Nginx health-route mappings
        run: |
          grep -Fq 'location = /api/health {' nginx/default.conf
          grep -Fq 'proxy_pass http://backend/health;' nginx/default.conf
          grep -Fq 'location = /api/health/db {' nginx/default.conf
          grep -Fq 'proxy_pass http://backend/health/db;' nginx/default.conf
          grep -Fq '/api/health"' .github/workflows/cd.yml
          grep -Fq '/api/health/db"' .github/workflows/cd.yml
          echo "Nginx maps both public health URLs to the matching backend endpoints, and CD checks both."

      - name: Verify deployment migrations run before app restart
        run: |
          db_start=$(grep -nF 'docker compose up -d --wait postgres' .github/workflows/cd.yml | cut -d: -f1)
          migration_002=$(grep -nF '002_user_settings.sql' .github/workflows/cd.yml | cut -d: -f1)
          migration_003=$(grep -nF '003_budget_uniqueness.sql' .github/workflows/cd.yml | cut -d: -f1)
          migration_004=$(grep -nF '004_restrict_category_budget_delete.sql' .github/workflows/cd.yml | cut -d: -f1)
          migration_005=$(grep -nF '005_user_phone.sql' .github/workflows/cd.yml | cut -d: -f1)
          migration_006=$(grep -nF '006_app_runtime_role.sql' .github/workflows/cd.yml | cut -d: -f1)
          app_start=$(grep -nF 'docker compose up -d --remove-orphans backend frontend nginx' .github/workflows/cd.yml | cut -d: -f1)
          test -n "$db_start" && test -n "$migration_002" && test -n "$migration_003" && test -n "$migration_004" && test -n "$migration_005" && test -n "$migration_006" && test -n "$app_start"
          if [ "$db_start" -ge "$migration_002" ] || [ "$migration_002" -ge "$migration_003" ] || [ "$migration_003" -ge "$migration_004" ] || [ "$migration_004" -ge "$migration_005" ] || [ "$migration_005" -ge "$migration_006" ] || [ "$migration_006" -ge "$app_start" ]; then
            echo "::error::Database migrations must complete before application services are restarted."
            exit 1
          fi
          echo "Deployment order keeps the current app running until database migrations complete."
          grep -qF 'docker login ghcr.io' .github/workflows/cd.yml
          grep -qF 'GHCR_READ_USERNAME' .github/workflows/cd.yml
          grep -qF 'GHCR_READ_TOKEN' .github/workflows/cd.yml
          grep -qF 'envs: GHCR_READ_USERNAME,GHCR_READ_TOKEN' .github/workflows/cd.yml
          echo "AWS deployment is configured to authenticate the VM before pulling GHCR images."

  backend:
    name: Backend (lint & test)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: expense_management_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d expense_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-key-with-at-least-thirty-two-bytes
      JWT_SECRET: ci-test-jwt-secret-key-with-at-least-thirty-two-bytes
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/expense_management_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci_app_user
      POSTGRES_PASSWORD: ci-app-password-long-enough-for-ci-123456789
      POSTGRES_BOOTSTRAP_USER: ci_user
      POSTGRES_APP_USER: ci_app_user
      POSTGRES_APP_PASSWORD: ci-app-password-long-enough-for-ci-123456789
      POSTGRES_DB: expense_management_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install flake8 pytest

      - name: Apply database migrations for API tests
        run: |
          shopt -s nullglob
          files=(../database/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No database migrations found for API tests."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Lint
        run: flake8 . --count --show-source --statistics --exclude .venv,venv,migrations

      - name: Test and verify repeatability
        run: |
          pytest -v
          pytest -v

  frontend:
    name: Frontend (lint, test & build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const report = require('./npm-audit.json');
          const vulnerabilities = report.vulnerabilities || {};
          for (const [name, item] of Object.entries(vulnerabilities)) {
            const advisories = (item.via || [])
              .filter((entry) => typeof entry === 'object')
              .map((entry) => entry.title || entry.name)
              .join('; ');
            console.log(
              `${item.severity.toUpperCase()} ${name}: range=${item.range}; ` +
              `direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}; ` +
              `advisories=${advisories}`
            );
          }
          console.log(
            'Audit totals:',
            JSON.stringify(report.metadata?.vulnerabilities || {})
          );
          NODE

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present
        env:
          CI: true

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: [detect, backend, frontend]
    if: >-
      always() &&
      needs.detect.outputs.docker == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile for ${{ matrix.service }} yet - skipping."
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.dockerfile.outputs.present == 'true'

      - name: Verify Docker build context ignore rules
        run: |
          for file in backend/.dockerignore frontend/.dockerignore; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
            grep -Fxq '.env' "$file" || { echo "::error::$file must exclude .env"; exit 1; }
            grep -Fxq '.env.*' "$file" || { echo "::error::$file must exclude .env.*"; exit 1; }
          done
          grep -Fxq 'node_modules/' frontend/.dockerignore || {
            echo "::error::Frontend build context must exclude node_modules."
            exit 1
          }
          echo "Docker build contexts exclude local env files; frontend also excludes host dependencies."

      - name: Add harmless sentinel environment file for build-context test
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then
            printf '%s\n' 'SECRET_SENTINEL=do-not-package' > backend/.env
          else
            printf '%s\n' 'VITE_SECRET_SENTINEL=do-not-embed' > frontend/.env.local
          fi

      - name: Build image (no push)
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          tags: expense-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify sentinel was excluded from the built image
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then
            docker run --rm --entrypoint sh expense-backend:ci -c 'test ! -e /app/.env'
          else
            docker run --rm --entrypoint sh expense-frontend:ci -c "test -d /usr/share/nginx/html && ! grep -R -q 'VITE_SECRET_SENTINEL' /usr/share/nginx/html"
          fi
          echo "Local environment sentinel was not included in the built image/assets."

  ci-success:
    name: ci-success
    needs: [detect, secret-scan, database, backend, frontend, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results of all CI jobs
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed (skipped jobs are expected for components not yet present)."
