# Continuous Delivery
#
# Runs only after the CI workflow has finished successfully on main, so the
# pipeline follows the order: Test -> Build -> Docker Build -> Deploy -> Health Check.
#   1. publish - builds the backend and frontend Docker images and pushes them
#                to GitHub Container Registry (ghcr.io). Services without a
#                Dockerfile yet are skipped.
#   2. deploy  - pulls the exact tested images on the AWS EC2 VM with Docker Compose and
#                checks the /health endpoint. Disabled until the repository
#                variable DEPLOY_ENABLED is set to "true" (see docs/ci-cd.md).

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish image (${{ matrix.service }})
    # Continue only when CI passed for a push to main (a merged PR), or on a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      # The exact commit that CI tested (falls back to the current commit on a manual run).
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Dockerfile for ${{ matrix.service }} yet - nothing to publish."
          fi

      - name: Lowercase image name
        if: steps.dockerfile.outputs.present == 'true'
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.dockerfile.outputs.present == 'true'

      - uses: docker/login-action@v4
        if: steps.dockerfile.outputs.present == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: steps.dockerfile.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ steps.image.outputs.short_sha }}
            type=raw,value=latest

      - name: Build and push
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to AWS EC2
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Pull images and restart services
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '~/expense-management-platform' }}
            COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            SHORT_SHA="$(printf '%s' "$COMMIT_SHA" | cut -c1-7)"
            git fetch origin "$COMMIT_SHA"
            git checkout --detach "$COMMIT_SHA"
            repo_lower=$(printf '%s' 'AyomideADEJARE1/Expense-Management-Platform' | tr '[:upper:]' '[:lower:]')
            export BACKEND_IMAGE="ghcr.io/${repo_lower}-backend:sha-${SHORT_SHA}"
            export FRONTEND_IMAGE="ghcr.io/${repo_lower}-frontend:sha-${SHORT_SHA}"
            docker compose pull backend frontend
            docker compose up -d --remove-orphans
            # This migration is idempotent and must also run for existing volumes.
            docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/002_user_settings.sql'
            docker image prune -f

      - name: Application and database health checks
        run: |
          app_url="${{ vars.APP_URL }}/api/health"
          db_url="${{ vars.APP_URL }}/api/health/db"

          echo "Checking application health: $app_url"
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$app_url"

          echo "Checking database health: $db_url"
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$db_url"
