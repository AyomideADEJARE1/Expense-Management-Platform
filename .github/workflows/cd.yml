# Continuous Delivery
#
# Runs only after the CI workflow has finished successfully on main, so the
# pipeline follows the order: Test -> Build -> Docker Build -> Deploy -> Health Check.
#   1. publish - builds the backend and frontend Docker images and pushes them
#                to GitHub Container Registry (ghcr.io). Services without a
#                Dockerfile yet are skipped.
#   2. deploy  - pulls the new images on the Azure VM with Docker Compose and
#                checks the /health endpoint. Disabled until the repository
#                variable DEPLOY_ENABLED is set to "true" (see docs/ci-cd.md).

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish image (${{ matrix.service }})
    # Continue only when CI passed for a push to main (a merged PR), or on a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      # The exact commit that CI tested (falls back to the current commit on a manual run).
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Dockerfile for ${{ matrix.service }} yet - nothing to publish."
          fi

      - name: Lowercase image name
        if: steps.dockerfile.outputs.present == 'true'
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.dockerfile.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.dockerfile.outputs.present == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: steps.dockerfile.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ steps.image.outputs.short_sha }}
            type=raw,value=latest

      - name: Build and push
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Azure VM
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Pull images and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '~/expense-management-platform' }}
            git pull --ff-only
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Health check
        run: |
          url="${{ vars.APP_URL }}/health"
          echo "Checking $url"
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$url"
